<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Waya ArcRaven profile banner</title>
  <desc id="desc">Animated engineering profile banner for Waya and ArcRaven.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070d" />
      <stop offset="0.38" stop-color="#071827" />
      <stop offset="0.72" stop-color="#0d3b3a" />
      <stop offset="1" stop-color="#10351f" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="170" y1="0" x2="830" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e" />
      <stop offset="0.5" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 144) rotate(90) scale(132 420)">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.30" />
      <stop offset="0.44" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="1" stop-color="#05070d" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-120%" width="160%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" stroke="#27455a" stroke-width="1" opacity="0.28" />
    </pattern>
    <style>
      .fade-in { animation: fade-in 900ms ease-out both; }
      .delay-1 { animation-delay: 180ms; }
      .delay-2 { animation-delay: 360ms; }
      .delay-3 { animation-delay: 540ms; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .dash { stroke-dasharray: 720; stroke-dashoffset: 720; animation: draw 2.2s ease-out forwards, breathe 3.4s ease-in-out 2.2s infinite; }
      .scan { animation: scan 4.2s ease-in-out infinite; }
      .float-a { animation: float-a 5.2s ease-in-out infinite; }
      .float-b { animation: float-b 6s ease-in-out infinite; }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.54; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.18); }
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.68; }
        50% { opacity: 1; }
      }
      @keyframes scan {
        0% { transform: translateX(-760px); opacity: 0; }
        15% { opacity: 0.9; }
        72% { opacity: 0.9; }
        100% { transform: translateX(760px); opacity: 0; }
      }
      @keyframes float-a {
        0%, 100% { transform: translate(0, 0); opacity: 0.72; }
        50% { transform: translate(18px, -10px); opacity: 1; }
      }
      @keyframes float-b {
        0%, 100% { transform: translate(0, 0); opacity: 0.6; }
        50% { transform: translate(-16px, 12px); opacity: 0.95; }
      }
    </style>
  </defs>

  <rect width="1000" height="300" rx="24" fill="url(#bg)" />
  <rect width="1000" height="300" rx="24" fill="url(#grid)" />
  <rect width="1000" height="300" rx="24" fill="url(#coreGlow)" />

  <g opacity="0.40">
    <path class="float-a" d="M112 52H258L312 106H428" stroke="#38bdf8" stroke-width="1.4" />
    <path class="float-b" d="M896 236H730L685 190H565" stroke="#22c55e" stroke-width="1.4" />
    <path class="float-a" d="M116 236H250L292 194H420" stroke="#f59e0b" stroke-width="1.2" />
    <path class="float-b" d="M885 62H748L704 104H588" stroke="#94a3b8" stroke-width="1.2" />
  </g>

  <g filter="url(#softGlow)">
    <path class="dash" d="M76 194H236L296 134H392" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path class="dash" d="M924 106H758L700 164H604" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path class="dash" d="M188 78H308L362 116H436" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path class="dash" d="M812 222H694L638 184H566" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g class="pulse" filter="url(#softGlow)">
    <circle cx="76" cy="194" r="7" fill="#22c55e" />
    <circle cx="296" cy="134" r="6" fill="#22c55e" />
    <circle cx="924" cy="106" r="7" fill="#38bdf8" />
    <circle cx="700" cy="164" r="6" fill="#38bdf8" />
  </g>

  <g opacity="0.78">
    <rect x="324" y="55" width="352" height="154" rx="18" fill="#05070d" fill-opacity="0.34" stroke="#2dd4bf" stroke-opacity="0.28" />
    <path d="M352 208H648" stroke="url(#lineGradient)" stroke-width="3" stroke-linecap="round" />
  </g>

  <g class="fade-in delay-1">
    <text x="500" y="124" text-anchor="middle" font-family="Inter, DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="800" fill="#f8fafc" letter-spacing="0">
      Waya
      <tspan fill="#22c55e" dx="14">/</tspan>
      <tspan fill="#f8fafc" dx="14">ArcRaven</tspan>
    </text>
  </g>

  <g class="fade-in delay-2">
    <text x="500" y="160" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="17" font-weight="600" fill="#cbd5e1" letter-spacing="0">
      CTO | Robotics &amp; Intelligent Hardware | AI Engineering
    </text>
  </g>

  <g class="fade-in delay-3" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="14" font-weight="700">
    <text x="380" y="196" text-anchor="middle" fill="#a7f3d0">Rust</text>
    <text x="462" y="196" text-anchor="middle" fill="#bfdbfe">Flutter</text>
    <text x="558" y="196" text-anchor="middle" fill="#fde68a">STM32C5</text>
    <text x="660" y="196" text-anchor="middle" fill="#ddd6fe">Long-Agent</text>
  </g>

  <g class="scan" filter="url(#softGlow)" opacity="0" transform="translate(-760 0)">
    <rect x="492" y="42" width="18" height="212" rx="9" fill="#f8fafc" opacity="0.24" />
    <rect x="498" y="42" width="3" height="212" rx="1.5" fill="#22c55e" />
  </g>

  <path d="M24 254C168 234 282 282 432 260C580 238 700 218 976 246" stroke="url(#lineGradient)" stroke-width="2" opacity="0.48" />
</svg>
